# Worktrunk project hooks. Shared with everyone who clones the repository;
# personal settings (worktree-path, commit generation) belong in
# ~/.config/worktrunk/config.toml instead.
#
# A project hook needs interactive approval the first time it runs and again
# whenever its command changes. Automated callers pass `wt switch --create … --yes`;
# Pico does, for the worktrees it makes its child sessions (proposal 0010).

# `pre-*` hooks block: a failure aborts the operation, and the worktree is ready when
# `wt switch` returns, before a child session starts in it. Each worktree is a new path,
# so mise has to trust it before any mise command in it will run. `copy-ignored` copies
# the gitignored build caches listed in .worktreeinclude — a reflink on APFS, so it costs
# nothing — before setup installs from the lockfile.
[[pre-start]]
trust = "mise trust --yes"

[[pre-start]]
tools = "mise install"

[[pre-start]]
copy = "wt step copy-ignored"

[[pre-start]]
setup = "mise run setup"

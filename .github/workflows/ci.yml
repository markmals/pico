name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    # `mise run check` is the one definition of the blocking gate. The pre-push hook
    # runs the same task, so the local gate and this one cannot drift apart.
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: jdx/mise-action@v5
            # Oxfmt, Oxlint and tsc are devDependencies, so `check` needs them.
            - run: mise run deps:install
            - run: mise run check

    # The macOS-only gates. `macos:check` now compiles the app, so it needs an Xcode
    # whose macOS SDK can build the manifest's macOS 27 deployment floor.
    # `macos-latest` is macOS 26 and carries Xcode 26 only, which rejects that floor,
    # so this job names `xcode-27` — the macOS 27 / Xcode 27 image, the only hosted
    # runner with that SDK. It is a public preview image: GitHub excludes preview
    # images from the Actions SLA and may change them weekly, so this job can fail or
    # lose its label for reasons outside the repository. Fix the toolchain when that
    # happens; never drop the build to make the job green.
    # `pico:verify` compiles the `pico` executable the Homebrew formula ships, which
    # fails on stale third-party notices, and runs it offline.
    native:
        name: macOS
        runs-on: xcode-27
        steps:
            - uses: actions/checkout@v7
            - uses: jdx/mise-action@v5
            - run: mise run macos:check
            - run: mise run deps:install
            - run: mise run pico:verify

    # The commit-msg hook validates one message as it is written; this validates the
    # whole pull request range, which can carry commits the hook never saw.
    commits:
        name: Commit messages
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: jdx/mise-action@v5
            - name: Validate pull request commit messages
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: bun tools/check-pr-commits.ts "$BASE_SHA" "$HEAD_SHA"

    # The release pull request consumes changesets instead of adding one, so it is exempt.
    changeset:
        name: Changeset
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: jdx/mise-action@v5
            - run: mise run deps:install
            - name: Require a changeset
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: bun tools/require-changeset.ts "$BASE_SHA" "$HEAD_SHA"

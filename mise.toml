#:schema https://mise.jdx.dev/schema/mise.json
# mise owns the task graph. Every other tool is invoked from a task here, so the
# local gate and the CI gate cannot drift apart.

[settings]
# Keep mise.lock current as tools change; `mise lock --platform …` regenerates it.
lockfile = true

[tools]
# The only JavaScript runtime here: package manager, test runner, and the
# interpreter for the zero-dependency TypeScript in tools/ and the skill helpers
# under .agents/skills. `@types/bun` in package.json tracks this pin.
bun = "1.4.4"
# hk's version must match the `amends`/`import` URLs in hk.pkl — bump both together.
hk = "2.8.1"
# `tools/status.ts` reads the pull request through `gh`; the hk `actionlint` step
# and CI check the workflows with the same pinned binary.
gh = "2.103.2"
actionlint = "1.7.12"
worktrunk = "0.81.0" # provides `wt`
# Beads is not in the mise registry; the GitHub release backend installs the same
# binary `brew install beads` does. Pin it: an older `bd` refuses to open a newer DB.
"github:gastownhall/beads" = "1.3.2" # provides `bd`
# Xcode supplies Swift and xcodebuild. The aqua backend provides Tuist lockfile
# checksums; `os` keeps the native tool off the Linux workflow runner.
"aqua:tuist/tuist" = { version = "4.196.1", os = ["macos"] }
# `acp:tck` runs the ACP compatibility kit, a Python tool, straight from its Git
# repository through `uvx`. uv is the only Python toolchain this repo needs.
uv = "0.13.6"

# node_modules/.bin stays off PATH: every shim in it starts with
# `#!/usr/bin/env node`. The tasks below run those same devDependency binaries as
# `bun run --bun <bin>`, which needs no Node executable.

# ── The uniform surface ──────────────────────────────────────────────────────

[tasks.setup]
description = "Idempotent first-run bootstrap: dependencies, work tracker, git hooks"
depends = ["deps:install"]
run = [
    # `--skip-agents` stops bd from writing its own agent-instruction files; AGENTS.md
    # documents the work tracker itself.
    # `--skip-hooks` is load-bearing: without it `bd init` points core.hooksPath at
    # .beads/hooks, and every hook hk installs is then ignored by git.
    "bd init --init-if-missing --non-interactive --prefix pico --skip-agents --skip-hooks",
    # Commit `.beads/issues.jsonl` so the work graph is reviewable in a diff.
    "bd config set export.auto true",
    # hk owns every git hook, beads included (see hk.pkl). Never run `bd hooks install`.
    "hk install --mise",
]

[tasks."deps:install"]
description = "Install dependencies from the committed lockfile"
run = "bun install --frozen-lockfile"

[tasks.fmt]
alias = "f"
description = "Format with Oxfmt; accepts file paths"
run = "bun run --bun oxfmt"

[tasks.lint]
alias = "l"
description = "Lint with Oxlint and apply safe fixes"
run = "bun run --bun oxlint --fix"

[tasks.typecheck]
description = "Typecheck the project with tsc"
run = "bun run --bun tsc"

[tasks.test]
alias = "t"
description = "Run the test suite once"
# Every path is named because `bun test` does not descend into dot directories,
# so a bare `bun test` never sees the skill helpers.
run = "bun test ./tools ./.agents/skills ./adapter"

[tasks.check]
alias = "c"
description = "The single blocking gate: formatting, lint, types, tests, records"
# `hk check --all` runs every step in hk.pkl: whitespace, newlines, merge markers,
# actionlint, Oxfmt, Oxlint, and the `typecheck` step (which calls `mise run
# typecheck`). Formatting, linting and type checking are therefore already in this
# gate — adding them to `depends` would only run them twice. If you remove a step
# from hk.pkl, add it back here.
# `macos:check` carries the native project configuration into this same gate and
# skips itself anywhere but macOS, so Linux keeps running exactly what it ran before.
depends = ["test", "macos:check"]
run = ["hk check --all", "mise run validate"]

[tasks.validate]
description = "Check proposals, policies, decisions and guides against the record rules"
run = "bun tools/validate.ts"

[tasks.status]
description = "Where the work stands: current phase, next action, who acts"
run = "bun tools/status.ts"

[tasks.changeset]
description = "Describe this change for the changelog (`mise run changeset -- --empty` when nothing releasable changed)"
run = "bun run --bun changeset add"

[tasks.version]
description = "Apply pending changesets: bump the version in package.json, write CHANGELOG.md and the xcconfig"
run = ["bun run --bun changeset version", "mise run version:sync"]

[tasks."version:sync"]
description = "Write the version package.json carries into Config/Version.xcconfig"
run = "bun tools/sync-version.ts"

# ── The ACP adapter ──────────────────────────────────────────────────────────
# The adapter is a stdio program, so everything below drives a real `.build/pico-acp`
# process rather than importing the modules.

[tasks."acp:launcher"]
description = "Write the executable .build/pico-acp that Sesh launches"
# `mise which bun` names the Bun this repository pins, which is what the launcher's shebang
# must be. Resolving it from PATH instead would bake in whichever Bun the builder happened
# to have first.
run = 'bun tools/write-launcher.ts "$(mise which bun)"'

[tasks."acp:smoke"]
description = "Drive .build/pico-acp through a real ACP session with your own OMP credentials"
depends = ["acp:launcher"]
run = "bun adapter/smoke/run.ts"

[tasks."acp:tck"]
description = "Check .build/pico-acp against the ACP compatibility kit"
depends = ["acp:launcher"]
# The kit is a Python tool with no release on PyPI, so it is pinned by commit and run
# straight from its repository; uv caches the environment after the first run.
# A real agent is far slower than the kit's fixtures, hence the raised deadlines. Its
# default cancel prompt is free-form writing, which a turn can finish before
# `session/cancel` lands; this one keeps the agent busy, so cancellation is exercised
# instead of reported as skipped.
run = """
uvx --from git+https://github.com/agentclientprotocol/acp-tck@b7f40fb3c003c45926547be5a1f7e2b374035815 \
    acp-tck \
    --timeout 90 --test-timeout 300 \
    --cancel-prompt 'Use the bash tool to run exactly this command and wait for it to finish: sleep 60' \
    -- {{config_root}}/.build/pico-acp
"""

# ── The pico executable ──────────────────────────────────────────────────────
# `.build/pico` is the single-file executable the Homebrew formula builds and bottles. Its path
# is quoted: a checkout can live under a folder with a space, as Sesh's worktrees do.

[tasks."pico:build"]
description = "Compile .build/pico and check THIRD-PARTY-NOTICES.md against what it bundles"
run = 'bun tools/build-pico.ts --outfile "{{config_root}}/.build/pico"'

[tasks."pico:verify"]
description = "Check .build/pico offline: --version, initialize, and a turn through a project extension"
depends = ["pico:build"]
run = 'bun adapter/smoke/verify.ts "{{config_root}}/.build/pico"'

[tasks."pico:smoke"]
description = "Drive .build/pico through a real ACP session with your own OMP credentials"
depends = ["pico:build"]
run = 'bun adapter/smoke/run.ts "{{config_root}}/.build/pico"'

[tasks."pico:tck"]
description = "Check .build/pico against the ACP compatibility kit"
depends = ["pico:build"]
run = """
uvx --from git+https://github.com/agentclientprotocol/acp-tck@b7f40fb3c003c45926547be5a1f7e2b374035815 \
    acp-tck \
    --timeout 90 --test-timeout 300 \
    --cancel-prompt 'Use the bash tool to run exactly this command and wait for it to finish: sleep 60' \
    -- "{{config_root}}/.build/pico"
"""

# ── The macOS companion app ──────────────────────────────────────────────────
# Project.swift points the Pico target at app/, so these tasks generate the Xcode
# project and build the actual app. Paths are quoted for the same reason the pico
# tasks quote theirs: a checkout can live under a folder with a space.

[tasks."macos:generate"]
description = "Generate Pico.xcodeproj and Pico.xcworkspace from Project.swift"
run = "tuist generate --no-open"

[tasks."macos:open"]
description = "Generate the Xcode project and open it in Xcode"
run = "tuist generate"

[tasks."macos:fmt"]
description = "Format the Swift manifests and the app sources in place"
# --recursive is what lets `app` be named as a directory; without it swift format
# rejects a path that is not a file.
run = "swift format --in-place --recursive --parallel Project.swift Tuist.swift app"

[tasks."macos:lint"]
description = "Check Swift formatting without rewriting it"
# --strict: without it `swift format lint` prints findings as warnings and still
# exits 0, so the gate would pass on unformatted code.
run = "swift format lint --strict --recursive --parallel Project.swift Tuist.swift app"

[tasks."macos:build"]
description = "Build the Debug Pico.app into .build/macos"
depends = ["macos:generate"]
# Derived data goes under the ignored .build/ with the repository's other build
# output, so the app the run task opens is always this checkout's.
run = '''
xcodebuild -workspace Pico.xcworkspace -scheme Pico -configuration Debug \
    -derivedDataPath "{{config_root}}/.build/macos" build
'''

[tasks."macos:run"]
description = "Build the app and open this checkout's .build/macos Debug Pico.app"
depends = ["macos:build"]
# The explicit path matters: a bare `open -a Pico` would launch whichever copy
# Launch Services knows about, which is not necessarily the one just built.
run = 'open "{{config_root}}/.build/macos/Build/Products/Debug/Pico.app"'

[tasks."macos:check"]
description = "Check the native project: formatting, generation, the build settings xcodebuild resolves, and a Debug build of the app"
# Everything below needs Xcode, and Tuist is a macOS-only pin, so off macOS this
# task reports success having run nothing.
skip_if = 'test "$(uname -s)" != Darwin'
run = [
    "mise run macos:lint",
    # `macos:build` generates the project through its own dependency and compiles
    # the app, so the gate generates once and builds once.
    "mise run macos:build",
    # Compiling proves the sources build, not that the project is configured the
    # way the manifest says: `-list` reads the generated workspace back, and
    # `-showBuildSettings` resolves every setting for the target. The settings dump
    # is kept out of the log because its failures go to stderr.
    "xcodebuild -workspace Pico.xcworkspace -list",
    "xcodebuild -project Pico.xcodeproj -target Pico -configuration Debug -showBuildSettings > /dev/null",
]

[tasks."macos:clean"]
description = "Remove the generated Xcode project and the files Tuist derives for it"
run = "rm -rf Pico.xcodeproj Pico.xcworkspace Derived"
